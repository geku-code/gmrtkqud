<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>절벽 위의 플로렌티아 (Plague of Florentia)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: #0f131d;
            --panel-border: #1e2638;
            --neon-cyan: #00f0ff;
            --neon-emerald: #00ff9d;
            --neon-purple: #bd00ff;
            --neon-crimson: #ff0055;
            --neon-amber: #ffaa00;
            --text-main: #e1e7ed;
            --text-muted: #7a8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 900px;
            background: var(--bg-dark);
            display: grid;
            grid-template-rows: 60px 1fr 50px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 1px solid var(--panel-border);
            position: relative;
        }

        /* Header Area */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .title-brand {
            font-size: 1rem;
            font-weight: 800;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
        }

        .speed-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .speed-btn.active, .speed-btn:hover {
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        /* Main Grid Body - 기본 PC 데스크톱 2열 구조 */
        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1px;
            background: var(--panel-border);
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        /* Status & Traits */
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .profile-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
        }

        .char-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .char-job {
            font-size: 0.8rem;
            color: var(--neon-amber);
            margin-top: 2px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .stat-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 8px;
            border-radius: 6px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .city-metrics {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .metric-bar-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .metric-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
        }

        .bar-bg {
            height: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            transition: width 0.4s ease;
        }

        /* Center Panel: Story & Choices */
        .story-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #090c14;
            position: relative;
            overflow: hidden;
        }

        .story-scroll-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-card {
            background: rgba(15, 19, 29, 0.8);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 0 8px 8px 0;
            padding: 14px;
            animation: fadeIn 0.3s ease;
        }

        .event-card.rare {
            border-left-color: var(--neon-purple);
            background: rgba(189, 0, 255, 0.05);
        }

        .event-card.plague {
            border-left-color: var(--neon-crimson);
            background: rgba(255, 0, 85, 0.05);
        }

        .event-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .event-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .event-desc {
            font-size: 0.92rem;
            line-height: 1.55;
            color: var(--text-main);
        }

        /* Choice Action Footer */
        .choice-panel {
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timer-bar-container {
            height: 3px;
            background: rgba(255,255,255,0.05);
            width: 100%;
            border-radius: 2px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background: var(--neon-amber);
            width: 100%;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .choice-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.88rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .choice-btn:hover, .choice-btn:active {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.08);
            color: #fff;
        }

        .choice-btn.hidden-route {
            border-color: var(--neon-purple);
            background: rgba(189, 0, 255, 0.08);
        }

        /* Traits Box */
        .traits-container-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            min-height: 70px;
            max-height: 120px;
            overflow-y: auto;
        }

        .trait-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            margin: 2px;
        }

        .trait-tag.innate { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .trait-tag.acquired { border-color: var(--neon-emerald); color: var(--neon-emerald); }
        .trait-tag.trauma { border-color: var(--neon-crimson); color: var(--neon-crimson); }

        /* Start Overlay Screen */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .game-title-large {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0,240,255,0.5);
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 280px;
            margin: 15px 0;
        }

        .input-group input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon-cyan);
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0,240,255,0.3);
            width: 100%;
            max-width: 280px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin-top: 10px;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        /* Modals */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }

        .dice-box {
            text-align: center;
            padding: 15px;
        }

        .dice-val {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--neon-amber);
            text-shadow: 0 0 20px rgba(255,170,0,0.5);
            margin: 10px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 📱 모바일 반응형 미디어 쿼리 (화면 너비 768px 이하) */
        @media screen and (max-width: 768px) {
            .game-wrapper {
                grid-template-rows: 50px 1fr 45px;
                height: 100vh;
                height: 100dvh; /* 모바일 브라우저 주소창 대응 */
                border: none;
            }

            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }

            /* 모바일에서는 캐릭터 스탯/지표 패널을 접이식 또는 상단 컴팩트 뷰로 전환 */
            .panel {
                max-height: 200px;
                padding: 10px 12px;
                gap: 8px;
                border-bottom: 1px solid var(--panel-border);
            }

            .stat-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .story-container {
                min-height: 300px;
            }

            .story-scroll-area {
                padding: 15px;
            }

            .choice-panel {
                padding: 10px;
            }

            .choice-btn {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .game-title-large {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Main Header -->
    <header>
        <div class="title-brand">
            <i class="fa-solid fa-biohazard"></i> FLORENTIA
        </div>
        <div class="time-control">
            <span id="game-year" style="font-weight: 700; color: #fff; font-size: 0.85rem;">AD 1320</span>
            <span id="game-age" style="color: var(--neon-cyan); font-size: 0.8rem;">(0세)</span>
            <div style="height: 10px; width: 1px; background: var(--panel-border); margin: 0 3px;"></div>
            <button class="speed-btn" onclick="setSpeed(0)"><i class="fa-solid fa-pause"></i></button>
            <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
            <button class="speed-btn" onclick="setSpeed(2)">2x</button>
            <button class="speed-btn" onclick="setSpeed(5)">5x</button>
        </div>
    </header>

    <!-- Main Game View -->
    <main>
        <!-- Left Panel: Stats, City Metrics & Traits -->
        <div class="panel">
            <div class="profile-card" style="padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="char-name" id="ui-char-name" style="font-size: 1rem;">레오나르도</div>
                    <div class="char-job" id="ui-char-job" style="font-size: 0.75rem;">무직 (유년기)</div>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-box"><div class="stat-label">지능</div><div class="stat-value" id="stat-int">10</div></div>
                <div class="stat-box"><div class="stat-label">체력</div><div class="stat-value" id="stat-phy">10</div></div>
                <div class="stat-box"><div class="stat-label">감각</div><div class="stat-value" id="stat-sen">10</div></div>
                <div class="stat-box"><div class="stat-label">매력</div><div class="stat-value" id="stat-cha">10</div></div>
                <div class="stat-box"><div class="stat-label">수완</div><div class="stat-value" id="stat-dex">10</div></div>
                <div class="stat-box"><div class="stat-label">면역</div><div class="stat-value" id="stat-imm">10</div></div>
            </div>

            <div class="city-metrics">
                <div class="metric-bar-group">
                    <div class="metric-info"><span>감염률</span><span id="val-inf" style="color:var(--neon-crimson)">0%</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="bar-inf" style="background:var(--neon-crimson); width:0%;"></div></div>
                </div>
                <div class="metric-bar-group">
                    <div class="metric-info"><span>시민 사기 / 위생 / 재정</span><span id="val-gold" style="color:var(--neon-amber)">1000 G</span></div>
                </div>
            </div>

            <div class="traits-container-box" id="traits-list">
                <!-- Traits tags inserted here -->
            </div>
        </div>

        <!-- Center Panel: Story & Choices -->
        <div class="story-container">
            <div class="story-scroll-area" id="story-log">
                <!-- Events populated via JS -->
            </div>
            <div class="choice-panel">
                <div class="timer-bar-container"><div class="timer-bar" id="timer-bar"></div></div>
                <div class="choices-grid" id="choices-container">
                    <!-- Choices populated via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Status Bar -->
    <footer style="background:var(--panel-bg); border-top:1px solid var(--panel-border); padding:0 15px; display:flex; align-items:center; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
        <div><i class="fa-solid fa-shield-halved"></i> 안정 구동</div>
        <div>플로렌티아 v2.2 Mobile</div>
    </footer>
</div>

<!-- Start Overlay Screen -->
<div class="overlay-screen" id="start-overlay">
    <div class="game-title-large">절벽 위의 플로렌티아</div>
    <div style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem; text-align: center;">Plague of Florentia: Life Chronology</div>
    
    <div class="input-group">
        <label style="font-size: 0.75rem; color: var(--text-muted); text-align: center;">인물 이름을 입력하십시오</label>
        <input type="text" id="player-name-input" value="레오나르도" maxlength="10">
    </div>

    <button class="btn-primary" onclick="startGame()"><i class="fa-solid fa-play"></i> 새로운 일대기 시작</button>

    <div class="nav-grid">
        <button class="btn-secondary" onclick="openModal('modal-history')">지난 삶 회고</button>
        <button class="btn-secondary" onclick="openModal('modal-codex')">직업 & 도감</button>
    </div>
</div>

<!-- Dice Modal -->
<div class="modal" id="modal-dice">
    <div class="modal-content" style="max-width: 360px;">
        <div class="modal-header">
            <span>1D100 운명의 주사위</span>
        </div>
        <div class="modal-body dice-box">
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="dice-check-title">판정 수행 중...</div>
            <div class="dice-val" id="dice-result-num">--</div>
            <div id="dice-target-info" style="font-size: 0.8rem; color: var(--neon-cyan);">목표치 확인 중</div>
            <button class="btn-primary" id="dice-confirm-btn" style="margin-top:15px; width:100%; display:none; max-width:100%;" onclick="closeModal('modal-dice')">결과 확인</button>
        </div>
    </div>
</div>

<!-- Educational Popup Modal -->
<div class="modal" id="modal-edu">
    <div class="modal-content">
        <div class="modal-header">
            <span style="color:var(--neon-cyan);"><i class="fa-solid fa-book-medical"></i> 역사 & 의학 노트</span>
        </div>
        <div class="modal-body">
            <div id="edu-content" style="line-height:1.5; font-size:0.9rem;"></div>
            <button class="btn-primary" style="margin-top:10px; width:100%; max-width:100%;" onclick="closeEduModal()">확인 및 계속</button>
        </div>
    </div>
</div>

<!-- History & Codex Modals -->
<div class="modal" id="modal-history">
    <div class="modal-content">
        <div class="modal-header"><span>지난 삶 회고</span><button class="btn-secondary" onclick="closeModal('modal-history')" style="padding:4px 8px;">닫기</button></div>
        <div class="modal-body" id="history-list-body">기록된 지난 삶이 없습니다.</div>
    </div>
</div>

<div class="modal" id="modal-codex">
    <div class="modal-content">
        <div class="modal-header"><span>직업 및 엔딩 도감</span><button class="btn-secondary" onclick="closeModal('modal-codex')" style="padding:4px 8px;">닫기</button></div>
        <div class="modal-body" id="codex-list-body"></div>
    </div>
</div>

<script>
/* 절벽 위의 플로렌티아: 모바일 최적화 게임 엔진 */
const gameState = {
    name: "레오나르도",
    year: 1320,
    age: 0,
    speed: 1,
    timer: null,
    quietYears: 0,
    job: null,
    stats: { int: 10, phy: 10, sen: 10, cha: 10, dex: 10, imm: 10 },
    city: { infection: 0, morale: 80, sanitation: 60, gold: 1000 },
    traits: [],
    unlockedJobs: [],
    history: [],
    pendingEdu: false,
    gameStarted: false,
    gameEnded: false,
    plagueActive: false,
    plagueResolved: false,
    ending: null
};

const JOBS = {
    doctor: { name: "역학 의사", type: "basic", desc: "환자 치료와 감염 관리에 특화" },
    merchant: { name: "무역 상인", type: "basic", desc: "자금 확보와 교역 수단 활용" },
    clerk: { name: "행정 서기", type: "basic", desc: "도시 자원 배분 및 격리 구역 지정" },
    priest: { name: "위령 사제", type: "basic", desc: "시민 사기 유지와 구호 활동" },
    herbalist: { name: "약초 연구자", type: "hidden", desc: "약초와 기록을 바탕으로 보조 치료법 탐색" },
    chronicler: { name: "역사 기록자", type: "hidden", desc: "역병의 전파와 사회적 양상을 기록" }
};

const INNATE_TRAITS = [
    { id: "t1", name: "강인한 체질", type: "innate", desc: "면역 +5", apply: () => gameState.stats.imm += 5 },
    { id: "t2", name: "예민한 관찰안", type: "innate", desc: "감각 +5", apply: () => gameState.stats.sen += 5 },
    { id: "t3", name: "상인의 피", type: "innate", desc: "초기 자금 +300", apply: () => gameState.city.gold += 300 }
];

function clamp(value, min = 0, max = 100) {
    return Math.max(min, Math.min(max, value));
}

function changeCity(key, amount, min = 0, max = 100) {
    gameState.city[key] = clamp(gameState.city[key] + amount, min, max);
}

function addHistory(title, detail = "") {
    gameState.history.push({ year: gameState.year, age: gameState.age, title, detail });
}

function startGame() {
    if (gameState.gameStarted) return;
    gameState.name = document.getElementById("player-name-input").value.trim() || "레오나르도";
    gameState.gameStarted = true;
    document.getElementById("ui-char-name").innerText = gameState.name;
    document.getElementById("start-overlay").style.display = "none";

    const picked = INNATE_TRAITS[Math.floor(Math.random() * INNATE_TRAITS.length)];
    gameState.traits.push(picked);
    picked.apply();
    addHistory("플로렌티아에서 태어남", `선천적 특성: ${picked.name}`);
    updateUI();
    showStoryCard("탄생과 선천적 기질", `${gameState.name}의 일대기가 시작됩니다. 태어날 때부터 남다른 기질을 지녔습니다. 어떤 삶을 살아갈지는 앞으로의 선택에 달려 있습니다.`, [
        { text: "새로운 삶을 시작한다", action: () => { addHistory("일대기 시작", "플로렌티아에서 성장하기 시작했다."); } }
    ]);
}

function updateUI() {
    const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.innerText = value;
    };
    setText("game-year", `AD ${gameState.year}`);
    setText("game-age", `(${gameState.age}세)`);
    setText("ui-char-name", gameState.name);
    setText("ui-char-job", gameState.job || "무직 (유년기)");
    setText("stat-int", gameState.stats.int);
    setText("stat-phy", gameState.stats.phy);
    setText("stat-sen", gameState.stats.sen);
    setText("stat-cha", gameState.stats.cha);
    setText("stat-dex", gameState.stats.dex);
    setText("stat-imm", gameState.stats.imm);

    setText("val-inf", `${gameState.city.infection}%`);
    setText("val-gold", `${gameState.city.gold}G | 위생:${gameState.city.sanitation}% | 사기:${gameState.city.morale}%`);
    const barInf = document.getElementById("bar-inf");
    if(barInf) barInf.style.width = `${clamp(gameState.city.infection)}%`;

    const traitContainer = document.getElementById("traits-list");
    if (traitContainer) {
        traitContainer.innerHTML = gameState.traits.map(t =>
            `<span class="trait-tag ${t.type}">${t.name}</span>`
        ).join("") || '<span style="font-size:0.7rem; color:var(--text-muted);">보유 특성 없음</span>';
    }
}

function startLoop() {
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    if (gameState.speed === 0 || !gameState.gameStarted || gameState.gameEnded || gameState.pendingEdu) return;

    gameState.timer = setInterval(() => {
        if (gameState.gameEnded || gameState.pendingEdu) return;
        gameState.age++;
        gameState.year++;
        gameState.quietYears++;
        updateUI();

        if (checkAgeMilestone()) return;
        if (checkCityCrisis()) return;
        if (gameState.quietYears >= 3) {
            triggerRandomEvent();
            return;
        }
        appendQuietYearLog();
    }, 3000 / gameState.speed);
}

function setSpeed(spd) {
    gameState.speed = spd;
    document.querySelectorAll(".speed-btn").forEach(btn => btn.classList.remove("active"));
    const buttons = [...document.querySelectorAll(".speed-btn")];
    const selected = buttons.find(btn => {
        const label = btn.innerText.trim();
        return (spd === 0 && label === "") || label === `${spd}x` || (spd === 1 && label === "1x");
    });
    if (selected) selected.classList.add("active");
    startLoop();
}

function checkAgeMilestone() {
    if (gameState.age === 5) {
        showStoryCard("유년기의 시련", "다섯 살이 되던 해, 플로렌티아 주변에 열병이 돌기 시작했습니다.", [
            { text: "몸 상태를 살피며 충분히 쉰다", action: () => { gameState.stats.phy += 2; addHistory("유년기의 시련", "휴식을 선택해 체력을 조금 길렀다."); } },
            { text: "약초상에게 가서 치료법을 물어본다", action: () => { gameState.stats.sen += 2; gameState.stats.int += 1; addHistory("약초상과의 만남", "주변 사람에게 도움을 구했다."); } }
        ]);
        return true;
    }
    if (gameState.age === 10) {
        if (Math.random() < 0.08) {
            showStoryCard("희귀한 만남", "골목길에서 오래된 약초 기록을 읽고 있는 수상한 약초상을 만났습니다.", [
                { text: "약초 기록을 정리하는 일을 돕는다 [약초 연구자 해금]", class: "hidden-route", action: () => {
                    unlockJob("herbalist");
                    gameState.stats.int += 3;
                    gameState.traits.push({ id: "herbal-note", name: "약초 기록의 견습", type: "acquired", desc: "약초 연구자 단서" });
                    addHistory("희귀한 만남", "약초 연구자의 길 단서 획득");
                }},
                { text: "가족에게 돌아간다", action: () => { gameState.stats.cha += 2; addHistory("골목길", "집으로 돌아갔다."); } }
            ], "rare");
        } else {
            showStoryCard("재능의 발현", "장인들이 아이들의 재능을 살피러 왔습니다.", [
                { text: "서재에서 학술 서적을 읽는다 (지능 +5)", action: () => { gameState.stats.int += 5; addHistory("재능", "지식을 쌓았다."); } },
                { text: "시장 거리에서 상인들의 흥정을 관찰한다 (수완 +5)", action: () => { gameState.stats.dex += 5; addHistory("재능", "흥정을 관찰했다."); } }
            ]);
        }
        return true;
    }
    if (gameState.age === 13) {
        showJobSelection();
        return true;
    }
    if (gameState.age === 18) {
        showStoryCard("견습의 끝", "기술을 사람들 앞에서 선보일 때가 되었습니다.", [
            { text: "스승의 추천을 받아 일자리를 구한다", action: () => { gameState.stats.cha += 3; addHistory("견습 완료", "일자리를 구했다."); } },
            { text: "새로운 기술을 배우며 진로를 넓힌다", action: () => { gameState.stats.int += 2; gameState.city.gold -= 50; addHistory("기술 습득", "새로운 기술을 익혔다."); } }
        ]);
        return true;
    }
    if (gameState.age === 24) {
        showAdultEvent();
        return true;
    }
    if (gameState.age === 28 && !gameState.plagueActive) {
        triggerPlagueOutbreak();
        return true;
    }
    if (gameState.age === 35 && gameState.plagueActive && !gameState.plagueResolved) {
        showPlagueAftermath();
        return true;
    }
    if (gameState.age >= 60) {
        endGame();
        return true;
    }
    return false;
}

function showJobSelection() {
    const available = ["doctor", "merchant", "clerk", "priest", ...gameState.unlockedJobs];
    const choices = available.filter(id => JOBS[id]).map(id => ({
        text: `[진로] ${JOBS[id].name} — ${JOBS[id].desc}`,
        action: () => {
            gameState.job = JOBS[id].name;
            addHistory("진로 선택", `${gameState.job}의 길을 선택했다.`);
            updateUI();
        }
    }));
    showStoryCard("13세: 견습과 진로 선택", "인생의 첫 진로를 결정할 시기입니다.", choices);
}

function showAdultEvent() {
    showStoryCard("성인이 된 뒤의 선택", "자신의 기술과 관계를 활용해 살아갑니다.", [
        { text: "일에 집중해 돈을 모은다 (재정 +150)", action: () => { gameState.city.gold += 150; addHistory("생업", "자원을 모았다."); } },
        { text: "이웃의 일을 돕는다 (사기 +5)", action: () => { changeCity("morale", 5); addHistory("협력", "이웃을 도왔다."); } }
    ]);
}

function appendQuietYearLog() {
    const log = document.getElementById("story-log");
    if (!log) return;
    const card = document.createElement("div");
    card.className = "event-card";
    card.style.opacity = "0.75";
    card.innerHTML = `<div class="event-header"><span>AD ${gameState.year}</span><span>${gameState.age}세</span></div><div class="event-title" style="font-size:0.9rem">평온한 한 해</div><div class="event-desc" style="font-size:0.85rem">별다른 사건 없이 일상이 이어졌습니다.</div>`;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    addHistory("평온한 한 해", "일상을 보냈다.");
}

function triggerRandomEvent() {
    gameState.quietYears = 0;
    showStoryCard("시장 거리의 소문", "시장에는 물가가 오른다는 소문이 돕니다.", [
        { text: "필요한 물자를 미리 확보한다 (재정 -50)", action: () => { gameState.city.gold -= 50; addHistory("물자 확보", "대비했다."); } },
        { text: "상인들과 가격을 협상한다 (수완 +2)", action: () => { gameState.stats.dex += 2; addHistory("협상", "이익을 얻었다."); } }
    ]);
}

function triggerPlagueOutbreak() {
    gameState.plagueActive = true;
    showStoryCard("흑사병의 전조 (AD 1348)", "항구 배에서 죽은 쥐들이 발견되고 선원들이 앓기 시작했습니다.", [
        { text: "항구를 임시로 통제하고 조사한다 (재정 -200, 위생 +10)", action: () => {
            gameState.city.gold -= 200; changeCity("sanitation", 10); changeCity("infection", 8);
            addHistory("항구 통제", "교역 손실을 감수하고 통제했다.");
            showEduModal("14세기 항구 도시들은 감염병 확산을 막기 위해 격리(Quarantine) 제도를 도입했습니다.");
        }},
        { text: "교역을 계속해 손실을 줄인다 (재정 +200, 감염 폭증)", action: () => {
            gameState.city.gold += 200; changeCity("infection", 25);
            addHistory("교역 지속", "감염 위험이 커졌다.");
        }}
    ], "plague");
}

function showPlagueAftermath() {
    gameState.plagueResolved = true;
    showStoryCard("역병 이후의 도시", "도시는 여파를 겪고 있습니다. 자원을 어디에 사용할까요?", [
        { text: "위생과 생활 환경 개선에 투자한다 (재정 -200, 위생 +15)", action: () => { gameState.city.gold -= 200; changeCity("sanitation", 15); addHistory("환경 개선", "위생에 투자했다."); } },
        { text: "구호 활동과 시민 지원을 우선한다 (재정 -150, 사기 +15)", action: () => { gameState.city.gold -= 150; changeCity("morale", 15); addHistory("시민 구호", "지원을 우선했다."); } }
    ], "plague");
}

function checkCityCrisis() {
    if (gameState.city.morale <= 0) {
        showStoryCard("도시의 신뢰 위기", "시민들의 불안과 불만이 커졌습니다.", [
            { text: "구호 활동을 조직한다 (재정 -100, 사기 +15)", action: () => { gameState.city.gold -= 100; changeCity("morale", 15); addHistory("구호 조직", "신뢰를 회복했다."); } }
        ], "rare");
        return true;
    }
    return false;
}

function showStoryCard(title, desc, choices, type = "normal") {
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    gameState.speed = 0;
    gameState.quietYears = 0;
    document.querySelectorAll(".speed-btn").forEach(btn => btn.classList.remove("active"));

    const log = document.getElementById("story-log");
    const card = document.createElement("div");
    card.className = `event-card ${type}`;
    card.innerHTML = `<div class="event-header"><span>AD ${gameState.year}</span><span>${gameState.age}세</span></div><div class="event-title">${title}</div><div class="event-desc">${desc}</div>`;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    addHistory(title, "");

    const choicesContainer = document.getElementById("choices-container");
    choicesContainer.innerHTML = "";
    choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = `choice-btn ${choice.class || ""}`;
        btn.textContent = choice.text;
        btn.onclick = () => {
            [...choicesContainer.querySelectorAll("button")].forEach(b => b.disabled = true);
            choicesContainer.innerHTML = "";
            choice.action();
            updateUI();
            if (!gameState.pendingEdu && !gameState.gameEnded) {
                gameState.speed = 1;
                startLoop();
            }
        };
        choicesContainer.appendChild(btn);
    });
}

function unlockJob(jobId) {
    if (!JOBS[jobId]) return;
    if (!gameState.unlockedJobs.includes(jobId)) gameState.unlockedJobs.push(jobId);
    try {
        const saved = JSON.parse(localStorage.getItem("florentia_jobs") || "[]");
        if (!saved.includes(jobId)) saved.push(jobId);
        localStorage.setItem("florentia_jobs", JSON.stringify(saved));
    } catch (e) {}
}

function loadUnlockedJobs() {
    try {
        gameState.unlockedJobs = JSON.parse(localStorage.getItem("florentia_jobs") || "[]");
    } catch (e) { gameState.unlockedJobs = []; }
}

function showEduModal(text) {
    gameState.pendingEdu = true;
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    document.getElementById("edu-content").innerText = text;
    openModal("modal-edu");
}

function closeEduModal() {
    closeModal("modal-edu");
    gameState.pendingEdu = false;
    updateUI();
    if (!gameState.gameEnded) {
        gameState.speed = 1;
        startLoop();
    }
}

function escapeHTML(v) {
    return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
}

function endGame() {
    if (gameState.gameEnded) return;
    gameState.gameEnded = true;
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;

    let title = "플로렌티아의 한 생애";
    let desc = `${gameState.name}은(는) 많은 선택과 변화를 겪으며 삶을 마무리했습니다.`;
    if (gameState.city.sanitation >= 75) {
        title = "회복을 이끈 시민";
        desc = "도시의 환경과 신뢰를 돌보며 플로렌티아가 회복할 기반을 남겼습니다.";
    }

    gameState.ending = { title, desc, year: gameState.year, age: gameState.age, job: gameState.job || "무직" };
    try {
        const lives = JSON.parse(localStorage.getItem("florentia_lives") || "[]");
        lives.push({ name: gameState.name, ending: gameState.ending, history: gameState.history });
        localStorage.setItem("florentia_lives", JSON.stringify(lives.slice(-20)));
    } catch (e) {}

    document.getElementById("edu-content").innerHTML = `<h3 style="color:var(--neon-cyan); margin-bottom:8px;">${escapeHTML(title)}</h3><p>${escapeHTML(desc)}</p><button class="btn-primary" style="margin-top:14px;width:100%;max-width:100%;" onclick="restartGame()">새로운 삶 시작</button>`;
    openModal("modal-edu");
}

function restartGame() {
    if (gameState.timer) clearInterval(gameState.timer);
    Object.assign(gameState, {
        name: "레오나르도", year: 1320, age: 0, speed: 1, timer: null, quietYears: 0,
        job: null, stats: { int: 10, phy: 10, sen: 10, cha: 10, dex: 10, imm: 10 },
        city: { infection: 0, morale: 80, sanitation: 60, gold: 1000 }, traits: [],
        unlockedJobs: [], history: [], pendingEdu: false, gameStarted: false, gameEnded: false,
        plagueActive: false, plagueResolved: false, ending: null
    });
    loadUnlockedJobs();
    document.getElementById("story-log").innerHTML = "";
    document.getElementById("choices-container").innerHTML = "";
    document.getElementById("player-name-input").value = "레오나르도";
    document.getElementById("start-overlay").style.display = "flex";
    document.getElementById("modal-edu").style.display = "none";
    updateUI();
}

function showHistoryModal() {
    let lives = [];
    try { lives = JSON.parse(localStorage.getItem("florentia_lives") || "[]"); } catch (e) {}
    const body = document.getElementById("history-list-body");
    body.innerHTML = lives.length ? lives.slice().reverse().map(l => `<div style="padding:8px 0;border-bottom:1px solid var(--panel-border)"><strong>${escapeHTML(l.name)} — ${escapeHTML(l.ending.title)}</strong><div style="font-size:0.8rem;color:var(--text-muted)">${escapeHTML(l.ending.job)} · ${l.ending.age}세</div></div>`).join("") : "기록된 지난 삶이 없습니다.";
}

function renderCodex() {
    const body = document.getElementById("codex-list-body");
    if (!body) return;
    const jobsHtml = Object.entries(JOBS).map(([id, j]) => {
        const unlocked = j.type === "basic" || gameState.unlockedJobs.includes(id);
        return `<div><strong>${unlocked ? escapeHTML(j.name) : "??? (숨겨진 직업)"}</strong><div style="font-size:0.8rem;color:var(--text-muted)">${unlocked ? escapeHTML(j.desc) : "특정 이벤트 단서 필요"}</div></div>`;
    }).join("");
    body.innerHTML = `<h4 style="color:var(--neon-cyan)">직업 도감</h4>${jobsHtml}`;
}

function openModal(id) {
    document.getElementById(id).style.display = "flex";
    if (id === "modal-codex") renderCodex();
    if (id === "modal-history") showHistoryModal();
}
function closeModal(id) { document.getElementById(id).style.display = "none"; }

loadUnlockedJobs();
</script>
</body>
</html>
