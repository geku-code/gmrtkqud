<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>절벽 위의 플로렌티아 (Plague of Florentia)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: #0f131d;
            --panel-border: #1e2638;
            --neon-cyan: #00f0ff;
            --neon-emerald: #00ff9d;
            --neon-purple: #bd00ff;
            --neon-crimson: #ff0055;
            --neon-amber: #ffaa00;
            --text-main: #e1e7ed;
            --text-muted: #7a8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            max-height: 900px;
            background: var(--bg-dark);
            display: grid;
            grid-template-rows: 60px 1fr 50px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 1px solid var(--panel-border);
            position: relative;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .title-brand {
            font-size: 1rem;
            font-weight: 800;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
        }

        .speed-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .speed-btn.active, .speed-btn:hover {
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1px;
            background: var(--panel-border);
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }

        .profile-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
        }

        .char-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .char-job {
            font-size: 0.8rem;
            color: var(--neon-amber);
            margin-top: 2px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .stat-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 8px;
            border-radius: 6px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .city-metrics {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .metric-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
        }

        .bar-bg {
            height: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            transition: width 0.4s ease;
        }

        .story-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #090c14;
            position: relative;
            overflow: hidden;
        }

        .story-scroll-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-card {
            background: rgba(15, 19, 29, 0.8);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 0 8px 8px 0;
            padding: 14px;
            animation: fadeIn 0.3s ease;
        }

        .event-card.rare {
            border-left-color: var(--neon-purple);
            background: rgba(189, 0, 255, 0.05);
        }

        .event-card.plague {
            border-left-color: var(--neon-crimson);
            background: rgba(255, 0, 85, 0.05);
        }

        .event-card.milestone {
            border-left-color: var(--neon-amber);
            background: rgba(255, 170, 0, 0.05);
        }

        .event-card.ambient {
            border-left-color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
            opacity: 0.85;
        }

        .event-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .event-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .event-desc {
            font-size: 0.92rem;
            line-height: 1.55;
            color: var(--text-main);
        }

        .event-result {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            font-size: 0.88rem;
            color: var(--neon-emerald);
        }

        .choice-panel {
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .choice-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .choice-btn:hover, .choice-btn:active {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.08);
            color: #fff;
        }

        .choice-btn.hidden-route {
            border-color: var(--neon-purple);
            background: rgba(189, 0, 255, 0.08);
        }

        .traits-container-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            min-height: 70px;
            max-height: 120px;
            overflow-y: auto;
        }

        .trait-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            margin: 2px;
        }

        .trait-tag.innate { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .trait-tag.acquired { border-color: var(--neon-emerald); color: var(--neon-emerald); }
        .trait-tag.inventory { border-color: var(--neon-amber); color: var(--neon-amber); }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .game-title-large {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0,240,255,0.5);
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 280px;
            margin: 10px 0;
        }

        .input-group input, .input-group select {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon-cyan);
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0,240,255,0.3);
            width: 100%;
            max-width: 280px;
            margin-top: 5px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            margin-top: 10px;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media screen and (max-width: 768px) {
            .game-wrapper {
                grid-template-rows: 50px 1fr 45px;
                height: 100vh;
                height: 100dvh;
            }
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .panel {
                max-height: 180px;
                padding: 10px 12px;
                gap: 8px;
            }
            .stat-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <header>
        <div class="title-brand">
            <i class="fa-solid fa-biohazard"></i> FLORENTIA
        </div>
        <div class="time-control">
            <span id="game-year" style="font-weight: 700; color: #fff; font-size: 0.85rem;">AD 1320</span>
            <span id="game-age" style="color: var(--neon-cyan); font-size: 0.8rem;">(0세)</span>
            <div style="height: 10px; width: 1px; background: var(--panel-border); margin: 0 3px;"></div>
            <button class="speed-btn" onclick="setSpeed(0)"><i class="fa-solid fa-pause"></i></button>
            <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
            <button class="speed-btn" onclick="setSpeed(2)">2x</button>
            <button class="speed-btn" onclick="setSpeed(5)">5x</button>
        </div>
    </header>

    <main>
        <div class="panel">
            <div class="profile-card" style="padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="char-name" id="ui-char-name" style="font-size: 1rem;">레오나르도</div>
                    <div class="char-job" id="ui-char-job" style="font-size: 0.75rem;">시민 (유년기)</div>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-box"><div class="stat-label">지능</div><div class="stat-value" id="stat-int">10</div></div>
                <div class="stat-box"><div class="stat-label">체력</div><div class="stat-value" id="stat-phy">10</div></div>
                <div class="stat-box"><div class="stat-label">감각</div><div class="stat-value" id="stat-sen">10</div></div>
                <div class="stat-box"><div class="stat-label">매력</div><div class="stat-value" id="stat-cha">10</div></div>
                <div class="stat-box"><div class="stat-label">수완</div><div class="stat-value" id="stat-dex">10</div></div>
                <div class="stat-box"><div class="stat-label">면역</div><div class="stat-value" id="stat-imm">10</div></div>
            </div>

            <div class="city-metrics">
                <div class="metric-bar-group">
                    <div class="metric-info"><span>감염률</span><span id="val-inf" style="color:var(--neon-crimson)">0%</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="bar-inf" style="background:var(--neon-crimson); width:0%;"></div></div>
                </div>
                <div class="metric-info"><span id="val-gold" style="color:var(--neon-amber)">1000 G | 위생:60% | 사기:80%</span></div>
            </div>

            <div class="section-title">소유 특성 및 비축 자산</div>
            <div class="traits-container-box" id="traits-list"></div>
        </div>

        <div class="story-container">
            <div class="story-scroll-area" id="story-log"></div>
            <div class="choice-panel">
                <div class="choices-grid" id="choices-container"></div>
            </div>
        </div>
    </main>

    <footer style="background:var(--panel-bg); border-top:1px solid var(--panel-border); padding:0 15px; display:flex; align-items:center; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
        <div><i class="fa-solid fa-shield-halved"></i> 안정 구동</div>
        <div>플로렌티아 v2.8 (풍성한 일상과 재능)</div>
    </footer>
</div>

<div class="overlay-screen" id="start-overlay">
    <div class="game-title-large">절벽 위의 플로렌티아</div>
    <div style="color: var(--text-muted); margin-bottom: 12px; font-size: 0.88rem; text-align: center;">Plague of Florentia: Life Chronology</div>
    
    <div class="input-group">
        <label style="font-size: 0.72rem; color: var(--text-muted); text-align: left;">이름</label>
        <input type="text" id="player-name-input" value="레오나르도" maxlength="10">
    </div>

    <div class="input-group">
        <label style="font-size: 0.72rem; color: var(--text-muted); text-align: left;">성별</label>
        <select id="player-gender-select">
            <option value="남성">남성</option>
            <option value="여성">여성</option>
        </select>
    </div>

    <div class="input-group">
        <label style="font-size: 0.72rem; color: var(--text-muted); text-align: left;">가문 및 신분</label>
        <select id="player-class-select">
            <option value="noble">귀족 가문 (자금 풍부, 매력 특화)</option>
            <option value="merchant">상인 가문 (수완 및 교역 특화)</option>
            <option value="citizen" selected>일반 시민 / 장인 (균형 잡힌 성장)</option>
            <option value="peasant">농민 / 하층민 (강인한 체력과 면역)</option>
        </select>
    </div>

    <button class="btn-primary" onclick="startGame()"><i class="fa-solid fa-play"></i> 새로운 일대기 시작</button>

    <div class="nav-grid">
        <button class="btn-secondary" onclick="openModal('modal-history')">지난 삶 회고</button>
        <button class="btn-secondary" onclick="openModal('modal-codex')">직업 & 도감</button>
    </div>
</div>

<div class="modal" id="modal-edu">
    <div class="modal-content">
        <div class="modal-header">
            <span style="color:var(--neon-cyan);"><i class="fa-solid fa-book-medical"></i> 역사 & 의학 노트</span>
        </div>
        <div class="modal-body">
            <div id="edu-content" style="line-height:1.5; font-size:0.9rem;"></div>
            <button class="btn-primary" style="margin-top:10px; width:100%; max-width:100%;" onclick="closeEduModal()">확인 및 계속</button>
        </div>
    </div>
</div>

<div class="modal" id="modal-history">
    <div class="modal-content">
        <div class="modal-header"><span>지난 삶 회고</span><button class="btn-secondary" onclick="closeModal('modal-history')" style="padding:4px 8px;">닫기</button></div>
        <div class="modal-body" id="history-list-body">기록된 지난 삶이 없습니다.</div>
    </div>
</div>

<div class="modal" id="modal-codex">
    <div class="modal-content">
        <div class="modal-header"><span>직업 및 엔딩 도감</span><button class="btn-secondary" onclick="closeModal('modal-codex')" style="padding:4px 8px;">닫기</button></div>
        <div class="modal-body" id="codex-list-body"></div>
    </div>
</div>

<script>
const gameState = {
    name: "레오나르도",
    gender: "남성",
    socialClass: "citizen",
    year: 1320,
    age: 0,
    speed: 1,
    timer: null,
    quietYears: 0,
    job: null,
    stats: { int: 10, phy: 10, sen: 10, cha: 10, dex: 10, imm: 10 },
    city: { infection: 0, morale: 80, sanitation: 60, gold: 1000 },
    traits: [],
    inventory: [],
    unlockedJobs: [],
    history: [],
    pendingEdu: false,
    gameStarted: false,
    gameEnded: false,
    plagueActive: false,
    plagueResolved: false,
    ending: null
};

const JOBS = {
    doctor: { name: "역학 의사", type: "basic", desc: "환자 치료와 감염 관리에 특화" },
    merchant: { name: "무역 상인", type: "basic", desc: "자금 확보와 교역 수단 활용" },
    clerk: { name: "행정 서기", type: "basic", desc: "도시 자원 배분 및 격리 구역 지정" },
    priest: { name: "위령 사제", type: "basic", desc: "시민 사기 유지와 구호 활동" },
    herbalist: { name: "약초 연구자", type: "hidden", desc: "약초와 기록을 바탕으로 보조 치료법 탐색" },
    chronicler: { name: "역사 기록자", type: "hidden", desc: "역병의 전파와 사회적 양상을 기록" }
};

function clamp(value, min = 0, max = 100) {
    return Math.max(min, Math.min(max, value));
}

function changeCity(key, amount, min = 0, max = 100) {
    gameState.city[key] = clamp(gameState.city[key] + amount, min, max);
}

function addHistory(title, detail = "") {
    gameState.history.push({ year: gameState.year, age: gameState.age, title, detail });
}

function startGame() {
    if (gameState.gameStarted) return;
    gameState.name = document.getElementById("player-name-input").value.trim() || "레오나르도";
    gameState.gender = document.getElementById("player-gender-select").value;
    gameState.socialClass = document.getElementById("player-class-select").value;

    let className = "시민";
    if (gameState.socialClass === "noble") {
        className = "귀족 가문";
        gameState.city.gold = 1800;
        gameState.stats.cha += 5;
        gameState.stats.int += 2;
        gameState.traits.push({ id: "c-noble", name: "귀족의 품위", type: "innate", desc: "매력 +5, 초기 자금 풍부" });
    } else if (gameState.socialClass === "merchant") {
        className = "상인 가문";
        gameState.city.gold = 1500;
        gameState.stats.dex += 5;
        gameState.stats.sen += 2;
        gameState.traits.push({ id: "c-merchant", name: "상인의 감각", type: "innate", desc: "수완 +5, 교역 유리" });
    } else if (gameState.socialClass === "peasant") {
        className = "농민 가문";
        gameState.city.gold = 600;
        gameState.stats.phy += 5;
        gameState.stats.imm += 5;
        gameState.traits.push({ id: "c-peasant", name: "들판의 생명력", type: "innate", desc: "체력 +5, 면역 +5" });
    } else {
        className = "일반 장인 가문";
        gameState.city.gold = 1000;
        gameState.stats.int += 3;
        gameState.stats.dex += 3;
        gameState.traits.push({ id: "c-citizen", name: "평범한 시민", type: "innate", desc: "균형 잡힌 능력치" });
    }

    gameState.gameStarted = true;
    document.getElementById("ui-char-name").innerText = `${gameState.name} (${gameState.gender[0]})`;
    document.getElementById("ui-char-job").innerText = `${className} (유년기)`;
    document.getElementById("start-overlay").style.display = "none";

    addHistory("플로렌티아에서 태어남", `${className} 출신으로 세상에 첫발을 내디뎠다.`);
    updateUI();
    showStoryCard("탄생과 가문의 배경", `${gameState.name}은(는) 플로렌티아의 ${className}에서 태어나 조용히 성장하기 시작했습니다.`, [
        { text: "주어진 환경에 적응하며 성실히 자란다", action: () => "어린 시절을 무탈하게 보내며 기초 소양을 익혔다." }
    ]);
}

function updateUI() {
    document.getElementById("game-year").innerText = `AD ${gameState.year}`;
    document.getElementById("game-age").innerText = `(${gameState.age}세)`;
    document.getElementById("stat-int").innerText = gameState.stats.int;
    document.getElementById("stat-phy").innerText = gameState.stats.phy;
    document.getElementById("stat-sen").innerText = gameState.stats.sen;
    document.getElementById("stat-cha").innerText = gameState.stats.cha;
    document.getElementById("stat-dex").innerText = gameState.stats.dex;
    document.getElementById("stat-imm").innerText = gameState.stats.imm;

    document.getElementById("val-inf").innerText = `${gameState.city.infection}%`;
    document.getElementById("val-gold").innerText = `${gameState.city.gold} G | 위생:${gameState.city.sanitation}% | 사기:${gameState.city.morale}%`;
    const barInf = document.getElementById("bar-inf");
    if(barInf) barInf.style.width = `${clamp(gameState.city.infection)}%`;

    const traitContainer = document.getElementById("traits-list");
    if (traitContainer) {
        const traitHtml = gameState.traits.map(t => `<span class="trait-tag ${t.type}">${t.name}</span>`).join("");
        const invHtml = gameState.inventory.map(inv => `<span class="trait-tag inventory"><i class="fa-solid fa-box-archive"></i> ${inv}</span>`).join("");
        traitContainer.innerHTML = (traitHtml + invHtml) || '<span style="font-size:0.7rem; color:var(--text-muted);">보유 특성 및 비축품 없음</span>';
    }
}

function startLoop() {
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    if (gameState.speed === 0 || !gameState.gameStarted || gameState.gameEnded || gameState.pendingEdu) return;

    gameState.timer = setInterval(() => {
        if (gameState.gameEnded || gameState.pendingEdu) return;
        gameState.age++;
        gameState.year++;
        gameState.quietYears++;
        updateUI();

        if (checkAgeMilestone()) return;
        if (gameState.quietYears >= 2) {
            triggerAmbientOrRandomEvent();
            return;
        }
        appendQuietYearLog();
    }, 3000 / gameState.speed);
}

function setSpeed(spd) {
    gameState.speed = spd;
    document.querySelectorAll(".speed-btn").forEach(btn => btn.classList.remove("active"));
    const buttons = [...document.querySelectorAll(".speed-btn")];
    const selected = buttons.find(btn => {
        const label = btn.innerText.trim();
        return (spd === 0 && label === "") || label === `${spd}x` || (spd === 1 && label === "1x");
    });
    if (selected) selected.classList.add("active");
    startLoop();
}

function checkAgeMilestone() {
    if (gameState.age === 5) {
        showStoryCard("유년기의 시련", "다섯 살이 되던 해, 플로렌티아 주변에 열병이 돌기 시작했습니다.", [
            { text: "몸 상태를 살피며 충분히 쉰다", action: () => { gameState.stats.phy += 2; return "체력이 조금 길러졌다."; } },
            { text: "이웃 어른에게 도움을 청한다", action: () => { gameState.stats.sen += 2; return "주변 사람들과 원만한 관계를 텄다."; } }
        ]);
        return true;
    }
    if (gameState.age === 8) {
        showStoryCard("아르노 강의 범람 (강제 이벤트)", "폭우로 인해 플로렌티아를 가로지르는 아르노 강이 범람하여 하류 지역의 가옥들이 물에 잠겼습니다.", [
            { text: "물에 잠긴 이웃들의 짐을 건네며 구호 활동을 돕는다", action: () => { gameState.stats.cha += 2; changeCity("morale", 4); return "이웃들에게 깊은 인상을 남기며 신뢰를 얻었다."; } },
            { text: "안전한 고지대로 올라가 피해를 피한다", action: () => { gameState.stats.sen += 1; return "침착하게 안전을 확보하여 화를 면했다."; } }
        ], "milestone");
        return true;
    }
    // [확장된 10세 재능의 발현 - 8가지 선택지]
    if (gameState.age === 10) {
        showStoryCard("재능의 발현 (10세)", "또래 아이들이 각자의 재능을 드러내기 시작하는 시기입니다. 당신의 눈길이 가장 오래 머문 곳은 어디인가?", [
            { text: "서재의 낡은 학술 서적과 연대기 (지능 +5)", action: () => { gameState.stats.int += 5; return "책 속의 지식을 빠르게 흡수하며 학구열을 불태웠다."; } },
            { text: "시장 거리의 활기찬 흥정과 동전 소리 (수완 +5)", action: () => { gameState.stats.dex += 5; return "상인들의 흥정 소리 속에서 경제적 감각을 텄다."; } },
            { text: "공방 구석의 깎아낸 나무 조각과 도구 (감각 +5)", action: () => { gameState.stats.sen += 5; return "손재주와 공간을 보는 눈이 남다르다는 칭찬을 들었다."; } },
            { text: "성당의 엄숙한 성가와 성스러운 분위기 (매력 +5)", action: () => { gameState.stats.cha += 5; return "주위 사람들의 마음을 편안하게 만드는 품성이 돋보였다."; } },
            { text: "광장에서 열린 검술과 신체 단련 (체력 +5)", action: () => { gameState.stats.phy += 5; return "지치지 않는 체력과 튼튼한 골격을 자랑했다."; } },
            { text: "도시 성벽 끝에서 바라본 거친 들판 (면역 +5)", action: () => { gameState.stats.imm += 5; return "외부 환경에 흔들리지 않는 강인한 면역력을 길렀다."; } },
            { text: "뒷골목 아이들과의 활기찬 숨바꼭질 (수완 +3, 감각 +2)", action: () => { gameState.stats.dex += 3; gameState.stats.sen += 2; return "도시의 골목길 구조와 눈썰미를 빠르게 익혔다."; } },
            { text: "연금술사와 장인의 작업실에서 주워들은 기록 (지능 +3, 감각 +2)", action: () => { gameState.stats.int += 3; gameState.stats.sen += 2; return "물질의 이치와 비밀스러운 지식에 매료되었다."; } }
        ], "milestone");
        return true;
    }
    if (gameState.age === 13) {
        showJobSelection();
        return true;
    }
    if (gameState.age === 21) {
        showStoryCard("사회 진출과 독립 평가 (강제 이벤트)", "성인이 되어 플로렌티아의 정식 일원으로 자립하기 위한 실무 평가가 진행되었습니다.", [
            { text: "철저히 준비해 우수한 성과를 낸다", action: () => { gameState.stats.int += 3; gameState.city.gold += 100; return "뛰어난 역량을 인정받아 평판이 올랐다."; } },
            { text: "무난하게 과정을 통과하고 실무에 투입된다", action: () => { gameState.stats.dex += 2; return "실무 감각을 익히며 무사히 자립했다."; } }
        ], "milestone");
        return true;
    }
    if (gameState.age === 28 && !gameState.plagueActive) {
        triggerPlagueOutbreak();
        return true;
    }
    if (gameState.age === 33 && gameState.plagueActive) {
        showStoryCard("광기와 마녀사냥의 소문 (강제 이벤트)", "역병의 참상이 길어지자, 광기 어린 군중이 누군가의 저주 때문이라며 무고한 이를 지목하려 합니다.", [
            { text: "군중을 설득해 이성을 찾도록 진정시킨다", action: () => { gameState.stats.cha += 3; changeCity("morale", 5); return "차분한 설득으로 무고한 희생을 막아냈다."; } },
            { text: "소용돌이에 휘말리지 않도록 조용히 피한다", action: () => { gameState.stats.sen += 2; return "위험한 분위기를 피해 안전을 도모했다."; } }
        ], "plague");
        return true;
    }
    if (gameState.age >= 60) {
        endGame();
        return true;
    }
    return false;
}

function showJobSelection() {
    const available = ["doctor", "merchant", "clerk", "priest", ...gameState.unlockedJobs];
    const choices = available.filter(id => JOBS[id]).map(id => ({
        text: `${JOBS[id].name}의 길을 걷는다 — ${JOBS[id].desc}`,
        action: () => {
            gameState.job = JOBS[id].name;
            document.getElementById("ui-char-job").innerText = `${gameState.job}`;
            return `${gameState.job}(으)로 첫 발을 내디뎠다.`;
        }
    }));
    showStoryCard("13세: 진로 선택", "인생의 첫 진로를 결정할 시기입니다.", choices);
}

function appendQuietYearLog() {
    const log = document.getElementById("story-log");
    if (!log) return;
    const card = document.createElement("div");
    card.className = "event-card";
    card.style.opacity = "0.75";
    card.innerHTML = `<div class="event-header"><span>AD ${gameState.year}</span><span>${gameState.age}세</span></div><div class="event-title" style="font-size:0.9rem">평온한 한 해</div><div class="event-desc" style="font-size:0.85rem">별다른 사건 없이 일상이 이어졌습니다.</div>`;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    addHistory("평온한 한 해", "일상을 보냈다.");
}

        const ambientPool = [
            {
                title: "아르노 강변의 노을",
                desc: "해 질 무렵, 아르노 강 수면 위로 붉은 노을이 내려앉고 다리 위를 거니는 시민들의 발걸음이 차분해집니다."
            },
            {
                title: "봄맞이 장터의 냄새",
                desc: "겨울이 지나고 열린 장터에서 구운 빵 냄새와 야생화 향기가 골목길 구석구석을 채웁니다."
            },
            {
                title: "가을비와 낡은 지붕",
                desc: "추슬러야 할 일들을 뒤로하고, 처마 끝에서 떨어지는 빗소리를 들으며 조용히 생각을 정리하는 해입니다."

                desc: "강가 풀밭에 앉아 피라미를 낚으며 웃음짓는 아이들의 모습에서 평화로운 일상의 온기가 느껴집니다."

            { text: "비축해 둔 식량을 시장에 내다 판다", action: () => {

                gameState.inventory = gameState.inventory.filter(i => i !== "식량 비축분");
                return "비축분을 적절한 시기에 처분해 상당한 이익을 얻었다.";

            { text: "혹시 모를 상황을 위해 계속 보관한다", action: () => { return "식량을 안전하게 지켜두었다."; } }
        ]);
        return;
    }

    const randomPool = [
        {
            title: "공방의 작업 경쟁",
            desc: "함께 일하는 동료와 작업 성과를 두고 선의의 경쟁이 붙었습니다.",

                { text: "남다른 솜씨와 집중력을 발휘한다", action: () => { gameState.stats.dex += 2; return "작업 속도와 완성도를 인정받았다."; } },

            ]
        },
        {
            title: "풍년과 곡물 시장",
            desc: "주변 농촌이 대풍년을 맞아 시장에 곡물이 넘쳐나고 가격이 크게 떨어졌습니다.",
            choices: [
                { text: "저렴해진 곡물을 싸게 사들인다", action: () => {
                    gameState.city.gold -= 40;
                    if (!gameState.inventory.includes("식량 비축분")) gameState.inventory.push("식량 비축분");
                    return "저렴한 곡물을 비축용으로 확보했다.";

                { text: "가벼운 마음으로 풍년의 분위기를 즐긴다", action: () => { changeCity("morale", 3); return "여유로운 하루를 보냈다."; } }
            ]
        }

    const picked = randomPool[Math.floor(Math.random() * randomPool.length)];
    showStoryCard(picked.title, picked.desc, picked.choices);
}

function showAmbientCard(title, desc) {
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    gameState.speed = 0;
    gameState.quietYears = 0;
    document.querySelectorAll(".speed-btn").forEach(btn => btn.classList.remove("active"));

    const log = document.getElementById("story-log");
    const card = document.createElement("div");
    card.className = "event-card ambient";
    card.innerHTML = `<div class="event-header"><span>AD ${gameState.year}</span><span>${gameState.age}세</span></div><div class="event-title">${title}</div><div class="event-desc">${desc}</div>`;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    addHistory(title, "소소한 일상을 보냄");

    const choicesContainer = document.getElementById("choices-container");
    choicesContainer.innerHTML = "";

    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span><i class="fa-solid fa-arrow-right"></i> 계속 진행하기</span>`;
    btn.onclick = () => {
        choicesContainer.innerHTML = "";
        updateUI();
        if (!gameState.pendingEdu && !gameState.gameEnded) {
            gameState.speed = 1;
            startLoop();
        }
    };
    choicesContainer.appendChild(btn);
}

function triggerPlagueOutbreak() {
    gameState.plagueActive = true;
    showStoryCard("흑사병의 전조 (AD 1348)", "항구 배에서 죽은 쥐들이 발견되고 선원들이 앓기 시작했습니다.", [
        { text: "항구를 임시로 통제하고 조사한다", action: () => {
            gameState.city.gold -= 200; changeCity("sanitation", 10); changeCity("infection", 8);
            showEduModal("14세기 항구 도시들은 감염병 확산을 막기 위해 격리(Quarantine) 제도를 도입했습니다.");
            return "항구를 봉쇄하여 확산을 늦췄지만 재정 손실을 입었다.";
        }},
        { text: "교역을 계속해 당장의 손실을 줄인다", action: () => {
            gameState.city.gold += 200; changeCity("infection", 25);
            return "교역을 유지하여 재정은 지켰으나, 감염병이 순식간에 번져나갔다.";
        }}
    ], "plague");
}

function showStoryCard(title, desc, choices, type = "normal") {
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    gameState.speed = 0;
    gameState.quietYears = 0;
    document.querySelectorAll(".speed-btn").forEach(btn => btn.classList.remove("active"));

    const log = document.getElementById("story-log");
    const card = document.createElement("div");
    card.className = `event-card ${type}`;
    card.innerHTML = `<div class="event-header"><span>AD ${gameState.year}</span><span>${gameState.age}세</span></div><div class="event-title">${title}</div><div class="event-desc">${desc}</div>`;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    addHistory(title, "");

    const choicesContainer = document.getElementById("choices-container");
    choicesContainer.innerHTML = "";
    choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = `choice-btn ${choice.class || ""}`;
        btn.textContent = choice.text;
        btn.onclick = () => {
            [...choicesContainer.querySelectorAll("button")].forEach(b => b.disabled = true);
            choicesContainer.innerHTML = "";
            
            const resultMsg = choice.action();
            updateUI();

            const resultDiv = document.createElement("div");
            resultDiv.className = "event-result";
            resultDiv.innerHTML = `<i class="fa-solid fa-circle-arrow-right"></i> <strong>결과:</strong> ${resultMsg}`;
            card.appendChild(resultDiv);
            log.scrollTop = log.scrollHeight;

            if (!gameState.pendingEdu && !gameState.gameEnded) {
                gameState.speed = 1;
                startLoop();
            }
        };
        choicesContainer.appendChild(btn);
    });
}

function unlockJob(jobId) {
    if (!JOBS[jobId]) return;
    if (!gameState.unlockedJobs.includes(jobId)) gameState.unlockedJobs.push(jobId);
    try {
        const saved = JSON.parse(localStorage.getItem("florentia_jobs") || "[]");
        if (!saved.includes(jobId)) saved.push(jobId);
        localStorage.setItem("florentia_jobs", JSON.stringify(saved));
    } catch (e) {}
}

function showEduModal(text) {
    gameState.pendingEdu = true;
    if (gameState.timer) clearInterval(gameState.timer);
    gameState.timer = null;
    document.getElementById("edu-content").innerText = text;
    openModal("modal-edu");
}

function closeEduModal() {
    closeModal("modal-edu");
    gameState.pendingEdu = false;
    updateUI();
    if (!gameState.gameEnded) {
        gameState.speed = 1;
        startLoop();
    }
}

function openModal(id) { document.getElementById(id).style.display = "flex"; }
function closeModal(id) { document.getElementById(id).style.display = "none"; }
</script>
</body>
</html>
